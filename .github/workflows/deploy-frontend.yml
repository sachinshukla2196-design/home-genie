# MANUAL ONLY. Deploys the website to Vercel with the Vercel CLI.
# NOTE: this does NOT get around Vercel's Hobby-plan rule for private repos. The CLI sends the
# commit author with the deployment, and Vercel blocks it unless that author may deploy to the
# project (verified: an owner-initiated CLI deploy of a non-owner commit was blocked). It only
# helps once the HEAD commit's author is allowed (owner-authored commit, or a Pro team member).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       – vercel.com/account/tokens (created by the project owner)
#   VERCEL_ORG_ID      – Vercel project → Settings → General → "Team ID" / owner ID
#   VERCEL_PROJECT_ID  – Vercel project → Settings → General → "Project ID"
name: Deploy frontend to Vercel

on:
  workflow_dispatch:

concurrency:
  group: vercel-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull project settings and production env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
