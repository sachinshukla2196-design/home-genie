# Runtime dependencies for hosts that build from this folder with uv (e.g. Vercel, root dir "backend").
# Vercel's Python builder prefers this file over requirements.txt. requirements.txt is the Emergent
# platform's list (it includes Emergent's private `emergentintegrations`, which no public index has).
# Keep these pins in step with requirements.txt.
[project]
name = "home-genies-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.110.1",
  "starlette==0.37.2",
  "pydantic==2.13.4",
  "pydantic_core==2.46.4",
  "email-validator==2.3.0",
  "motor==3.3.1",
  "pymongo==4.6.3",
  "dnspython==2.8.0",
  "python-dotenv==1.2.2",
  "bcrypt==4.1.3",
  "PyJWT==2.13.0",
  "httpx==0.28.1",
  "requests==2.34.2",
  "razorpay==2.0.1",
  "python-multipart==0.0.32",
  "stripe==14.4.1",
]
